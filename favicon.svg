<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
  </defs>

  <!-- Hintergrund: Weltraum -->
  <rect width="32" height="32" rx="6" fill="#060b18"/>

  <!-- Sterne -->
  <circle cx="5"  cy="4"  r="0.5" fill="white" opacity="0.8"/>
  <circle cx="12" cy="2"  r="0.4" fill="white" opacity="0.6"/>
  <circle cx="20" cy="5"  r="0.5" fill="white" opacity="0.9"/>
  <circle cx="27" cy="3"  r="0.4" fill="white" opacity="0.7"/>
  <circle cx="3"  cy="10" r="0.3" fill="white" opacity="0.5"/>
  <circle cx="29" cy="9"  r="0.4" fill="white" opacity="0.6"/>
  <circle cx="8"  cy="14" r="0.3" fill="white" opacity="0.4"/>
  <circle cx="25" cy="13" r="0.3" fill="white" opacity="0.5"/>

  <!-- Planet -->
  <g clip-path="url(#clip)">
    <circle cx="16" cy="38" r="22" fill="url(#planet)"/>

    <!-- Atmosphären-Glühen (blauer Ring) -->
    <circle cx="16" cy="38" r="22" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.5"/>
    <circle cx="16" cy="38" r="22" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.4"/>

    <!-- Sonnenaufgang-Licht -->
    <ellipse cx="16" cy="16.5" rx="8" ry="3" fill="url(#glow)" opacity="0.95"/>

    <!-- Lichtpunkt -->
    <circle cx="16" cy="15.5" r="1.5" fill="white" opacity="0.95"/>
    <circle cx="16" cy="15.5" r="3"   fill="#bfdbfe" opacity="0.4"/>
  </g>
</svg>
